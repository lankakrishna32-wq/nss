<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | SRGEC NSS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main class="login-shell">
    <form class="card card-body login-card" data-login>
      <div class="brand">
        <span class="logo">NSS</span>
        <div>
          <strong style="font-size: 1.15rem; color: #fff;">SRGEC NSS Admin</strong>
          <span style="display: block; font-size: 0.8rem; color: var(--orange-light);">Content Management Portal</span>
        </div>
      </div>
      <h1 style="font-size: 1.6rem; margin: 4px 0 8px;">Admin Login</h1>
      <div style="background: rgba(245, 130, 32, 0.12); padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid rgba(245, 130, 32, 0.25); margin-bottom: 8px;">
        <p style="font-size: 0.85rem; color: var(--text); margin: 0;"><strong>User ID:</strong> <code style="color: var(--orange); background: var(--bg-alt); padding: 2px 6px; border-radius: 4px; font-weight: 700;">admin</code></p>
        <p style="font-size: 0.85rem; color: var(--text); margin: 6px 0 0;"><strong>Password:</strong> <code style="color: var(--orange); background: var(--bg-alt); padding: 2px 6px; border-radius: 4px; font-weight: 700;">srgec@nss2026</code></p>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.88rem; color: var(--muted);">
        User ID / Username
        <input class="input" name="username" placeholder="admin" autocomplete="username" value="admin" required>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.88rem; color: var(--muted);">
        Password
        <input class="input" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
      </label>
      <p class="meta" data-login-error style="color: #ef4444; font-weight: 600; min-height: 1.2em; margin: 0;"></p>
      <button class="btn orange" type="submit" style="width: 100%; justify-content: center; padding: 14px; font-weight: 700;">Sign In to Dashboard &rarr;</button>
      <a class="btn ghost" href="/index.html" style="text-align: center; justify-content: center;">&larr; Back to Website</a>
    </form>
  </main>
  <!-- Firebase App & Firestore SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
